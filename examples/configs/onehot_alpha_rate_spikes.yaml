run:
  seed: 42

symbol_space:
  alphabet:
    size: 10
  eos: "#"

symseq:
  generator:
    type: ArtificialGrammar
    mode: random
    params:
      label: Constrained Random Grammar
      ambiguities: 0
      ambiguity_depth: 0
      n_start_states: 1
      transition_density: 0.25
      assume_equiprobable: true
  trial_constraints:
    length:
      min: 1
      max: 20
  tasks:
    - id: next_token
      type: NStepPrediction
      params:
        n: 1

seqbench:
  mode: file
  prob_generator_type: restricted
  splits:
    train: 100
    test: 100
  time_grid:
    dt: 0.001
  storage:
    path: data/SeqBench
    force_rebuild: true
  composition:
    combine_sequences: true
    sample_length: 20
  input_mapping:
    base: one_hot
    base_params: {}
    transforms:
      - type: ExpandDim
        params:
          axis: 1
          target_size: 700
      - type: TemporalUnfold
        params:
          kernel_spec:
            shape: alpha
            params:
              tau: 0.01
              width: 0.1
          out_dt: 0.001
          duration: 0.1
          amplitude: 100.0
      - type: RateCoding
        params:
          max_rate: 200.0
          normalize: true
      - type: PoissonEncoding
        params:
          temporal: true
          spike_dt: 0.001
  task:
    source: symseq
    ref_id: next_token
